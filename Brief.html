<!doctype html>
<html lang="de">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Joti+One&display=swap" rel="stylesheet">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&display=swap" rel="stylesheet">




<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefpapier geöffnet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">
    <article class="paper">

      <div class="notes">
        <p class="note avoid">#Avoid humans</p>
        <p class="note humans">
          Humans =
          <img class="teufel-icon" src="svgs/teufel.svg" alt="teufel">
        </p>
      </div>

      <h1>IT'S YOUR FAULT !</h1>

      <p class="body-text">
        Hello, my name is Dino and I am dead. Luckily I didn’t die because of you.<br>Let me tell you who did.
      </p>

      <div class="hero">
        <div class="left-panel">
          <div class="speech">
            <img src="SVGs/sprechblase.svg" alt="Sprechblase">
            <div class="speech-text">This is the Mergus australis.</div>
          </div>

          <div class="dino-wrap">
            <img src="SVGs/dino.gif" alt="Dino">
          </div>
        </div>

        <div class="right-panel">
          <div class="screenshot">
            <div class="screenshot-placeholder"></div>
            <div class="screenshot-text">A screenshot of the investigation page would be shown here.</div>
            <img src="SVGs/regret.png" alt="Kleines Männlein">
            <img class="kill-button" src="SVGs/killagainbutton.svg" alt="Kill again button">
          </div>
        </div>
      </div>

      <img class="evolution" src="SVGs/humanshit.svg" alt="Menschen evolution">

      <div class="heart-wrap">
        <img src="SVGs/brokenheart.svg" alt="Broken heart">
      </div>

      <div class="footer">
        <img src="SVGs/beashamedbutton.svg" alt="Close letter and be ashamed">
      </div>

    </article>
  </div>
<script src="js/script.js" type="module"></script>
</body>

</html>
