<!doctype html>
<html lang="de">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Joti+One&display=swap" rel="stylesheet">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&display=swap" rel="stylesheet">




<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefpapier geöffnet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="page">
    <article class="paper">

      <div class="notes">
        <p class="note avoid">#Avoid humans</p>
        <p class="note humans">
          Humans =
          <img class="teufel-icon" src="svgs/teufel.svg" alt="teufel">
        </p>
      </div>

      <h1>IT'S YOUR FAULT !</h1>

      <p class="body-text">
        Hello, my name is Dino and I am dead. Luckily I didn’t die because of you.<br>Let me tell you who did.
      </p>

      <div class="hero">
        <div class="left-panel">

          <div class="speech">
            <img class="speech-bubble-img" src="SVGs/sprechblase.svg" alt="Sprechblase">

            <div id="speechText" class="speech-text">
              This is the Mergus australis.
            </div>

            <img id="speechNext" class="speech-next" src="svgs/pfeil.svg" alt="next">
          </div>

          <div class="dino-wrap">
            <img src="SVGs/dino.gif" alt="Dino">
          </div>

        </div>

        <div class="right-panel">
          <div class="screenshot">
            <iframe id="animalFrame" class="animal-frame" src="https://en.wikipedia.org/wiki/Auckland_merganser"
              title="Wikipedia page about extinct animal">
            </iframe>

            <img id="regretIcon" class="regret-icon" src="SVGs/regret.svg" data-white="SVGs/regret.svg"
              data-black="SVGs/regretblack.svg" alt="Add to regret list">

            <img class="kill-button" src="SVGs/killagainbutton.svg" alt="Kill again button">
          </div>
        </div>
      </div>

      <img class="evolution" src="SVGs/humanshit.svg" alt="Menschen evolution">

      <div class="heart-wrap" id="heartButton">
        <img id="heartImage" src="SVGs/brokenheart.svg" alt="Broken heart">
        <div id="heartAnimation"></div>
      </div>

      <a class="footer" href="brief_geschlossen.html">
        <img id="closeLetterButton" src="SVGs/beashamedbutton.svg" alt="Close letter and be ashamed">
      </a>

    </article>
  </div>

  <script>
    const heartButton = document.getElementById("heartButton");
    const heartImage = document.getElementById("heartImage");
    const heartAnimationContainer = document.getElementById("heartAnimation");

    let heartClicked = false;

    heartButton.addEventListener("click", () => {
      if (heartClicked) return;
      heartClicked = true;

      heartImage.style.display = "none";
      heartAnimationContainer.style.display = "block";

      const animation = lottie.loadAnimation({
        container: heartAnimationContainer,
        renderer: "svg",
        loop: false,
        autoplay: true,
        path: "svgs/newbrokenheart.json"
      });

      animation.addEventListener("complete", () => {
        window.location.href = "regretlist.html";
      });
    });
  </script>

  <script src="js/script.js" type="module"></script>
</body>

</html>
